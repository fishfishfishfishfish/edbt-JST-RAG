# TCRag configuration: nuggetindex + SpacyLLMHybridConstructor (ingestion)
#                       + JSTRetriever (retrieval)
#
# Ingestion stage (takes effect on a fresh ingest):
#   - extractor.type=llm serves as the LLM branch of the hybrid constructor (the
#     PlaceholderValidity-wrapped nuggetindex LLMExtractor / OllamaCompatClient chain);
#   - SpacyLLMHybridConstructor routes each document using
#     models/spacy_suitability_logreg_th6.joblib:
#       pred=1 -> local spaCy triple extraction (no LLM)
#       pred=0 -> LLM extraction
#   - The constructor is forcibly injected (registered name spacy_llm_hybrid) by the
#     companion entry point scripts/run_benchmark_jstrag.py,
#     independently of the dataset;
#   - With --reuse-db no extractor is built and the constructor is not triggered; retrieval is evaluated only.
#
# Retrieval stage (dual-axis partitioned cascade with early-stopping reranking):
#   BM25 recall of 1000 -> full temporal_coeff -> T x C dual-axis partitioning -> diagonal
#   levels L1..L6 -> sliding-window per-level semantic reranking + hybrid scoring -> adjacent-level dominance-gated early stop
#   -> top_k.
#
# Optional environment variables:
#   RERANKER_MODEL / RERANKER_TYPE / BM25_INDEX_PATH
#   HYBRID_BASE (default 0.0; setting it to 1.0 is equivalent to the semantic-reranking-only baseline)
#   SNT_WITH_TITLE (default true)
#   CASCADE_EARLY_STOP (default true; false runs the full baseline for ablation)
#   CASCADE_T_HIGH / CASCADE_T_LOW (defaults 0.9 / 0.6)
#   CASCADE_T_BINS (default 1; number of uniform partitions over [t_low,t_high), total bucket count = t_bins+2)
#   CASCADE_C_BINS (default 3; number of BM25-rank partition buckets on the C axis)
#   CASCADE_GATE_TOPK (default 10)
#   CASCADE_PATIENCE (default 2)
#
# This configuration is dataset-independent: --dataset / --format / --db-path are all passed explicitly by the companion shell script.
#
# To run (companion shell; the first run performs a full ingest to build the hybrid index; add --reuse-db to reuse it):
#   bash scripts/run_benchmark_jstrag_timeqa.sh --no-qa --query-limit 5

logging:
  level: INFO
  file: logs/tcrag.log
  console: true

llm:
  provider: ollama
  model: llama3.2
  api_key: ""
  base_url: ""
  temperature: 0.0
  max_tokens: 2048
  timeout: 600
  ollama_host: http://localhost:11434
  ollama_model: llama3.2
  structured_compat: true

extractor:
  # Takes effect only on a fresh ingest: serves as the LLM branch of the hybrid constructor;
  # the spaCy branch is built internally by the constructor factory (en_core_web_sm).
  type: llm
  llm_provider: ollama

rag:
  top_k: 20
  ctx_top_k: 5
  context_token_budget: 3000
  fusion: rrf

systems:
  jstrag:
    enabled: true
    # The companion shell overrides this per dataset via --db-path to point at the dedicated hybrid index.
    db_path: data/jstrag.db
    # Injection of the dual-axis partitioned cascade early-stopping retriever
    retriever_factory: "tcrag.retrievers.jstretriever:create_jst_retriever"

evaluation:
  metrics:
    retrieval_k: [5, 10, 20]
    qa: true
    system_perf: true
  output_dir: reports
  ragas:
    enabled: false
